name: Build Proton 11.0-1 Steam + UnixLibs (x86_64 + arm64ec)

# Manually-triggered build of Proton 11.0-1 for both architectures, packaged as
# WinNative content packages (.wcp).
#
# The layer itself carries no Steam binaries: the app installs the lsteamclient
# bridge into the container. "steam" in the versionName is the capability marker
# WinNative keys off (ComponentsScreen.isSteamCompatible() matches "steam" in the
# versionName), so the name is load-bearing and must not be reworded.
#
# Likewise "arm64ec" in the versionName is what WineInfo.fromIdentifier() falls back
# to when the strict wine/proton identifier regex does not match, which is the case
# for every name carrying a suffix. Dropping it silently downgrades the layer to
# x86_64 and the container launches under the wrong emulator.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'profile.json versionCode (install dir is <versionName>-<versionCode>; bump for A/B coexistence)'
        required: true
        default: '0'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip flex bison gettext autoconf \
            automake libtool pkg-config mingw-w64 gcc-multilib g++-multilib \
            libfreetype6-dev libfreetype6-dev:i386 libpng-dev libpng-dev:i386 \
            zlib1g-dev zlib1g-dev:i386 zstd jq

      # The unixlib loader is compiled into ntdll's unix half. It is a static
      # function, so it is invisible to nm once the tree is stripped -- assert on the
      # source instead, which is authoritative and cannot produce a false pass.
      - name: Assert UnixLibs support is present in the source
        run: |
          set -euo pipefail
          fail=0
          check() { # <description> <file> <pattern>
            if grep -q -- "$3" "$2"; then
              echo "  ok   : $1"
            else
              echo "  MISS : $1  ($2 :: $3)"; fail=1
            fi
          }
          check "load_unixlib_by_name defined"      dlls/ntdll/unix/loader.c       "^NTSTATUS load_unixlib_by_name"
          check "load_unixlib_by_name declared"     dlls/ntdll/unix/unix_private.h "load_unixlib_by_name"
          check "\$PREFIX/lib/wine search dir"      dlls/ntdll/unix/loader.c       'getenv( "PREFIX" )'
          check "NtQueryVirtualMemory load hook"    dlls/ntdll/unix/virtual.c      "MemoryWineLoadUnixLibByName"
          check "NtQueryVirtualMemory unload hook"  dlls/ntdll/unix/virtual.c      "MemoryWineUnloadUnixLib"
          check "wow64 thunk"                       dlls/wow64/virtual.c           "MemoryWineLoadUnixLibByName"
          check "info classes in winternl.h"        include/winternl.h             "MemoryWineLoadUnixLibByNameWow64"
          test "$fail" -eq 0 || { echo "UnixLibs support is incomplete -- refusing to build"; exit 1; }

      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/WinNative-Emu/proton-wine/releases/download/Assets/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen
        run: bash build-scripts/build-step0-autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: bash build-scripts/build-step0.sh

      - name: Build sysvshm library (aarch64 only)
        if: matrix.arch == 'aarch64'
        run: bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Configure build for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --configure
          else
            bash build-scripts/build-step-arm64ec.sh --configure
          fi

      - name: Build Proton for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build
          else
            bash build-scripts/build-step-arm64ec.sh --build
          fi

      - name: Install Proton for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --install
          else
            bash build-scripts/build-step-arm64ec.sh --install
          fi

      # Best-effort binary confirmation. A stripped tree has no symbol table, which is
      # expected and must not fail the build -- the source assertion above is the gate.
      - name: Confirm unixlib loader in built ntdll.so (best effort)
        run: |
          set -uo pipefail
          NM=$HOME/Android/Sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            NTDLL=$HOME/compiled-files-x86_64/lib/wine/x86_64-unix/ntdll.so
          else
            NTDLL=$HOME/compiled-files-aarch64/lib/wine/aarch64-unix/ntdll.so
          fi
          test -f "$NTDLL" || { echo "ERROR: $NTDLL missing"; exit 1; }
          if "$NM" "$NTDLL" 2>/dev/null | grep -q load_unixlib_by_name; then
            echo "OK: load_unixlib_by_name present in $NTDLL"
          else
            echo "NOTE: no symbol table in $NTDLL (stripped) -- source assertion already gated this."
          fi

      # Runs after the symbol check above, which needs the symbol table. Wine's install
      # leaves full debug info in the tree (~2GB arm64ec / ~1GB x86_64); stripping brings
      # it to ~756MB / ~308MB, which is what the released layers carry.
      - name: Strip the installed tree for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          STRIP=$HOME/Android/Sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUT=$HOME/compiled-files-x86_64
          else
            OUT=$HOME/compiled-files-aarch64
          fi
          before=$(du -sm "$OUT" | cut -f1)
          # llvm-strip is COFF/arm64ec- and ELF-aware, so it covers both the PE modules and
          # the unix .so loaders. --strip-all keeps PE exports and ELF .dynsym (the unixlibs'
          # __wine_unix_call_funcs entry point lives there); --strip-debug is the fallback,
          # and an unexpected format never fails the build.
          find "$OUT" -type f \( -name '*.so' -o -name '*.dll' -o -name '*.exe' -o -name '*.drv' \
               -o -name 'wine*' -o -name 'msi*' -o -name 'reg*' -o -name 'notepad' \) -print0 \
            | while IFS= read -r -d '' f; do
                "$STRIP" --strip-all "$f" 2>/dev/null || "$STRIP" --strip-debug "$f" 2>/dev/null || true
              done
          after=$(du -sm "$OUT" | cut -f1)
          echo "tree: ${before}MB -> ${after}MB after strip"

      - name: Build prefixPack.tzst for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            PP=prefixPack-x86_64-11.txz
          else
            PP=prefixPack-arm64ec-11.txz
          fi
          wget -q "https://github.com/WinNative-Emu/proton-wine/releases/download/Assets/$PP" -O /tmp/prefixPack.txz
          # WinNative picks the decompressor from the file extension
          # (ContainerManager.extractContainerPatternFile: ".tzst" -> ZSTD, anything else -> XZ),
          # so the name and the actual compression must agree. Recompress xz -> zstd; the
          # container pattern is unpacked on every container create, and zstd is far faster
          # to decompress on-device.
          mkdir -p /tmp/pp && tar -xJf /tmp/prefixPack.txz -C /tmp/pp
          tar -C /tmp/pp -I 'zstd -T0 -19' -cf $GITHUB_WORKSPACE/prefixPack.tzst .
          printf 'prefixPack.tzst magic: '; head -c4 $GITHUB_WORKSPACE/prefixPack.tzst | xxd -p
          head -c4 $GITHUB_WORKSPACE/prefixPack.tzst | xxd -p | grep -qi '^28b52ffd$' \
            || { echo "ERROR: prefixPack.tzst is not zstd"; exit 1; }

      - name: Generate profile.json for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VC='${{ github.event.inputs.version_code }}'
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            VERSION_NAME="11.0-1-x86_64-steam"
          else
            VERSION_NAME="11.0-1-arm64ec-steam-unixlib"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "$VERSION_NAME",
            "versionCode": $VC,
            "description": "$VERSION_NAME - WinNative layer with steam support",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.tzst"
            }
          }
          EOF
          cat $GITHUB_WORKSPACE/profile.json

      # Guards against the exact ways a layer silently stops being detected by the app.
      - name: Validate profile.json against the WinNative contract
        run: |
          set -euo pipefail
          P=$GITHUB_WORKSPACE/profile.json
          jq -e . "$P" > /dev/null                                  # parses at all
          jq -e '.type == "Proton"'          "$P" > /dev/null       # ContentType.getTypeByName
          jq -e '.versionCode | type=="number"' "$P" > /dev/null    # readProfile getInt
          jq -e '.files | type=="array"'     "$P" > /dev/null       # readProfile getJSONArray
          jq -e '.wine.binPath == "bin" and .wine.libPath == "lib"' "$P" > /dev/null
          jq -e '.wine.prefixPack == "prefixPack.tzst"' "$P" > /dev/null
          VN=$(jq -r .versionName "$P")
          # ContentsManager.getProfileByEntryName() splits "<type>-<verName>-<verCode>" on the
          # first and last dash, so a versionName may not itself start or end with a dash.
          case "$VN" in -*|*-) echo "ERROR: versionName '$VN' has a leading/trailing dash"; exit 1;; esac
          # ComponentsScreen.isSteamCompatible()
          echo "$VN" | grep -qi steam || { echo "ERROR: versionName '$VN' lacks the steam marker"; exit 1; }
          if [ "${{ matrix.arch }}" == "aarch64" ]; then
            # WineInfo.fromIdentifier() arch fallback
            echo "$VN" | grep -qi arm64ec || { echo "ERROR: versionName '$VN' lacks the arm64ec marker"; exit 1; }
          else
            echo "$VN" | grep -qi arm64ec && { echo "ERROR: x86_64 versionName '$VN' contains arm64ec"; exit 1; }
          fi
          echo "profile.json satisfies the WinNative detection contract: $VN"

      - name: Package .wcp for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUT=$HOME/compiled-files-x86_64
            ASSET=Proton-11.0-1-x86-64-steam.wcp
          else
            OUT=$HOME/compiled-files-aarch64
            ASSET=Proton-11.0-1-arm64ec-steam-unix.wcp
          fi
          echo "ASSET=$ASSET" >> $GITHUB_ENV

          for d in bin lib share; do
            test -d "$OUT/$d" || { echo "ERROR: $OUT/$d missing"; exit 1; }
          done

          cp $GITHUB_WORKSPACE/prefixPack.tzst "$OUT/"
          cp $GITHUB_WORKSPACE/profile.json    "$OUT/"
          cd "$OUT"
          # zstd container: ContentsManager sniffs the magic and picks ZSTD or XZ, so a zstd
          # .wcp installs on stock WinNative and unpacks much faster than xz.
          tar -I 'zstd -T0 -19' -cf "$GITHUB_WORKSPACE/$ASSET" bin lib share prefixPack.tzst profile.json
          ls -lh "$GITHUB_WORKSPACE/$ASSET"

      - name: Verify packaged .wcp
        run: |
          set -euo pipefail
          A=$GITHUB_WORKSPACE/$ASSET
          head -c4 "$A" | xxd -p | grep -qi '^28b52ffd$' || { echo "ERROR: .wcp is not zstd"; exit 1; }
          # profile.json and prefixPack must sit at the archive root: ContentsManager looks for
          # them in the extraction root, not in a nested directory. List once into a file --
          # piping tar into `grep -q` makes grep exit early, and the resulting SIGPIPE on tar
          # trips pipefail even though the entry was found.
          tar --zstd -tf "$A" > /tmp/wcp-list.txt
          grep -qx 'profile.json'    /tmp/wcp-list.txt || { echo "ERROR: profile.json not at root"; exit 1; }
          grep -qx 'prefixPack.tzst' /tmp/wcp-list.txt || { echo "ERROR: prefixPack.tzst not at root"; exit 1; }
          echo "--- profile.json as packaged ---"
          tar --zstd -xOf "$A" profile.json | jq .
          echo "--- top-level entries ---"
          tar --zstd -tf "$A" | awk -F/ '{print $1}' | sort -u

      - name: Upload ${{ env.ASSET }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION_NAME }}
          path: ${{ env.ASSET }}
          retention-days: 30
